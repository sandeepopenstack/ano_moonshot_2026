# tools.yaml — MCP Toolbox for Databases
# Spanner source:
#   tmforum_xl -> tmf_node_entity and tmf_node_changerequest

sources:
  spanner-tmforum-xl:
    kind: spanner
    project: poc-z-in2300756
    instance: verizon-gnn
    database: tmforum_xl

tools:
  query_tmf_node_entity:
    kind: spanner-sql
    source: spanner-tmforum-xl
    description: >
      Query tmf_node_entity table for entity metadata, criticality tier,
      subscriber count, and premium subscriber count.
      Used by ReflexAgent to calculate domain triage, impact_score,
      criticality_score, and criticality_label.
    parameters:
      - name: eids
        type: array
        description: List of entity EIDs to query from tmf_node_entity
        items:
          name: eid
          type: string
          description: A single entity EID string
    statement: |
      SELECT
        eid,
        entity_type,
        network_domain,
        network_segment,
        criticality_tier,
        subscriber_count,
        premium_subscriber_count
      FROM tmf_node_entity
      WHERE eid IN UNNEST(@eids)

  query_tmf_node_changerequest:
    kind: spanner-sql
    source: spanner-tmforum-xl
    description: >
      Query tmf_node_changerequest table for change request validation.
      Used by ReflectionAgent Gate 2 to verify whether a change request
      associated with the original 2B event date has been closed or completed.
      ReflectionAgent passes event_time from the GCS file and optionally
      passes change_request_id.
    parameters:
      - name: event_time
        type: string
        description: Original 2B eventTime from GCS, for example 2026-06-10T10:13:30Z

      - name: change_request_id
        type: string
        description: Optional change request ID, for example CR-SYN-201. Pass empty string for date-only lookup.

      - name: target_entities
        type: array
        description: Optional list of target entity IDs from Executor response. Accepted for ReflectionAgent contract.
        items:
          name: eid
          type: string
          description: A single target entity ID

    statement: |
      SELECT
        change_request_id,
        event_time,
        close_time,
        status,
        change_type_name,
        risk_score,
        reversibility_score
      FROM tmf_node_changerequest
      WHERE DATE(event_time) = DATE(TIMESTAMP(@event_time))
        AND (@change_request_id = "" OR change_request_id = @change_request_id)
      ORDER BY event_time DESC